<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom of the Elite - Cilt 23 Bölümleri</title>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #d1d5db;
            /* COTE Mor Teması */
            --accent-color: #bb86fc;
            --border-color: #2a2a2a;
            --btn-bg: #1a1a1a;
            --btn-hover: #bb86fc;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .top-nav {
            margin-bottom: 25px;
        }

        .top-nav a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            display: inline-block;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .top-nav a:hover {
            opacity: 0.8;
            transform: translateX(-3px);
        }

        .header-title {
            text-align: center;
            color: var(--accent-color);
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(187, 134, 252, 0.25);
        }

        /* 8 Bölüm İçin Grid Yapısı */
        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .chapter-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chapter-card:hover {
            background-color: var(--btn-hover);
            color: #121212;
            border-color: var(--btn-hover);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(187, 134, 252, 0.3);
        }

        @media (max-width: 480px) {
            .chapters-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
            .chapter-card {
                padding: 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <a href="index.html">← Cilt Seçimine Dön</a>
        </div>

        <h1 class="header-title">CİLT 23 – BÖLÜM LISTESİ</h1>

        <div class="chapters-grid">
            <a href="cilt23/bolum1.html" class="chapter-card">Bölüm 1</a>
            <a href="cilt23/bolum2.html" class="chapter-card">Bölüm 2</a>
            <a href="cilt23/bolum3.html" class="chapter-card">Bölüm 3</a>
            <a href="cilt23/bolum4.html" class="chapter-card">Bölüm 4</a>
            <a href="cilt23/bolum5.html" class="chapter-card">Bölüm 5</a>
            <a href="cilt23/bolum6.html" class="chapter-card">Bölüm 6</a>
            <a href="cilt23/bolum7.html" class="chapter-card">Bölüm 7</a>
            <a href="cilt23/bolum8.html" class="chapter-card">Bölüm 8</a>
        </div>
    </div>

</body>
</html>
