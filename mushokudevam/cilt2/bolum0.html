<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushoku Tensei Cilt 1, Bölüm 0 | Plotka Novel</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #d1d5db;
            --accent-color: #e52b2b; /* Mushoku Tensei Kırmızı Tema */
            --border-color: #333;
            --font-size: 18px;
        }

        /* 1. BEYAZ TEMA */
        body.theme-light {
            --bg-color: #ffffff;
            --card-bg: #f3f4f6;
            --text-color: #111827;
            --accent-color: #cc0000;
            --border-color: #e5e7eb;
        }

        /* 2. SEPYA (KİTAP SEÇENEĞİ) TEMASI */
        body.theme-sepia {
            --bg-color: #f5efe6;
            --card-bg: #e8dfd1;
            --text-color: #433422;
            --accent-color: #8c1b1b;
            --border-color: #d8c8b4;
        }

        /* METİN KUTUSU GÖRÜNÜMÜ */
        body.theme-gray-box .novel-text {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        body {
            font-family: 'Segoe UI', Georgia, serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .reader-container {
            max-width: 750px;
            width: 100%;
        }

        /* Simetrik Kontrol Barı Layout'u */
        .controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background-color: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            gap: 6px;
            justify-content: flex-start;
        }

        .controls-center {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
        }

        .nav-right {
            display: flex;
            justify-content: flex-end;
        }

        .nav-btn, .action-btn, .theme-select {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            background: var(--bg-color);
            padding: 7px 12px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .theme-select {
            outline: none;
            font-family: inherit;
        }

        .nav-btn:hover, .action-btn:hover, .theme-select:hover {
            background-color: var(--accent-color);
            color: #121212;
        }

        body.theme-light .nav-btn:hover, 
        body.theme-light .action-btn:hover, 
        body.theme-light .theme-select:hover,
        body.theme-sepia .nav-btn:hover, 
        body.theme-sepia .action-btn:hover, 
        body.theme-sepia .theme-select:hover {
            color: #ffffff;
        }

        /* Başlık Alanı */
        header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin: 0 0 8px 0;
        }

        .subtitle {
            color: #888;
            font-size: 0.95rem;
        }

        /* Tipografi ve Metin Alanı */
        .novel-text {
            font-size: var(--font-size);
            line-height: 1.85;
            letter-spacing: 0.2px;
            transition: background-color 0.3s, padding 0.3s;
        }

        .novel-text p {
            margin-bottom: 1.4em;
        }

        /* Resimler için özel stil */
        .novel-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 30px auto;
            border-radius: 6px;
        }

        /* Kapanış yazısı için özel stil */
        .author-note {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            text-align: center;
        }

        /* Alt Navigasyon Barı */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="reader-container">
        <!-- Üst Kontrol Barı -->
        <div class="controls">
            <!-- Sol Taraf -->
            <div class="nav-left">
                <a href="../index.html" class="nav-btn">🏠 Ana Sayfa</a>
                <a href="../cilt2bolumler.html" class="nav-btn">← Cilt İçeriği</a> 
            </div>

            <!-- Orta Taraf (Ayarlar) -->
            <div class="controls-center">
                <button class="action-btn" onclick="changeFontSize(-1)">A-</button>
                <button class="action-btn" onclick="changeFontSize(1)">A+</button>
                <select class="theme-select" onchange="applyTheme(this.value)">
                    <option value="dark">🌙 Karanlık</option>
                    <option value="light">☀️ Beyaz</option>
                    <option value="sepia">📖 Kitap (Sepya)</option>
                </select>
                <button class="action-btn" onclick="toggleBox()">🔲 Kutu</button>
            </div>

            <!-- Sağ Taraf -->
            <div class="nav-right">
                <a href="bolum1parca1.html" class="nav-btn">Sonraki Bölüm →</a>
            </div>
        </div>

        <!-- Başlık -->
        <header>
            <h1>Mushoku Tensei Cilt 2, Bölüm 0</h1>
            <div class="subtitle">"Başlangıç Kitap Fotoğrafları"</div>
        </header>

        <!-- Bölüm Metni -->
        <main class="novel-text" id="text-content">
            
            <!-- Ba şlangıç Fotoğrafları -->
            <img src="bolum0foto1.png" alt="Kitap Çizimi 1" class="novel-image">
            <img src="bolum0foto2.png" alt="Kitap Çizimi 2" class="novel-image">
            <img src="bolum0foto3.png" alt="Kitap Çizimi 3" class="novel-image">
            <img src="bolum0foto4.png" alt="Kitap Çizimi 4" class="novel-image">

            <div class="author-note">
                <p><i>“Hayaller Baskıya Rağmen Yaşar."
                    -Kızgın olduğunda bile kalbini takip et 
                </i></p>
                <p><b>Yazar:</b> Rudeus Greyrat</p>
                <p><b>Çeviren:</b> Jean RF Magott</p>
            </div>

        </main>

        <!-- Alt Navigasyon -->
        <div class="bottom-nav">
            <a href="../cilt2bolumler.html" class="nav-btn">← Cilt İçeriği</a>
            <a href="bolum1parca1.html" class="nav-btn">Sonraki Bölüm →</a>
        </div>
    </div>

    <!-- Scriptler -->
    <script>
        let currentSize = 18;
        const textElement = document.getElementById('text-content');

        function changeFontSize(delta) {
            currentSize += delta;
            if (currentSize < 12) currentSize = 12;
            if (currentSize > 28) currentSize = 28;
            textElement.style.fontSize = currentSize + 'px';
        }

        function applyTheme(themeName) {
            document.body.classList.remove('theme-light', 'theme-sepia');
            if (themeName === 'light') {
                document.body.classList.add('theme-light');
            } else if (themeName === 'sepia') {
                document.body.classList.add('theme-sepia');
            }
        }

        function toggleBox() {
            document.body.classList.toggle('theme-gray-box');
        }
    </script>
</body>
</html>
